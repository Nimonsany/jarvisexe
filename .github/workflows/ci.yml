# CI — validation only. Never publishes releases.
# Triggers (M9 Phase 1): push to master, PRs targeting master, manual dispatch.
# Release packaging lives in release.yml (tag/dispatch only).
name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Typecheck core (static-analysis gate)
        run: npx tsc --noEmit -p packages/core/tsconfig.json
      - name: Typecheck desktop (static-analysis gate)
        run: npx tsc --noEmit
        working-directory: apps/desktop
      - name: Secret scan (tracked files)
        run: |
          if git grep -nIE "BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-" -- \
              ':(exclude)tests/sanitize.test.ts' ':(exclude)tests/security-hardening.test.mts'; then
            echo "secret-like pattern found in tracked files" >&2
            exit 1
          fi
          echo "clean"
      - name: Dependency audit (production)
        run: npm audit --omit=dev
      - name: Unit + integration tests
        run: npx tsx --test tests/*.test.ts tests/*.mts
      - name: Frontend tests
        run: npx vitest run
        working-directory: apps/desktop

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Sidecar launch smoke (Phase 5)
        run: |
          STAGE=$(mktemp -d); cp -R dist-core/* "$STAGE"/
          JARVIS_PORT=7901 JARVIS_RUNTIME_DIR="$STAGE/rt" "$STAGE/jarvis-core" > /tmp/core-smoke.log 2>&1 &
          CPID=$!
          code=000
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -m 2 -o /tmp/h.json -w "%{http_code}" http://127.0.0.1:7901/api/health || true)
            [ "$code" = "200" ] && break
          done
          echo "health=$code"; cat /tmp/h.json 2>/dev/null; echo
          kill $CPID 2>/dev/null || true
          [ "$code" = "200" ] || { echo "sidecar smoke failed"; cat /tmp/core-smoke.log; exit 1; }
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp dist-core/jarvis-core "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
          chmod +x "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
      - name: Build app
        # validation build only: skip updater artifacts (they require TAURI_SIGNING_PRIVATE_KEY;
        # updater .app.tar.gz + .sig are produced by release.yml which has the secret)
        run: npx tauri build --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: apps/desktop/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: ci-macos-app
          path: apps/desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary
        shell: pwsh
        run: |
          $triple = (((rustc -vV) -match '^host: ') -split ' ')[1]
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item dist-core/jarvis-core.cmd "apps/desktop/src-tauri/binaries/jarvis-core-$triple.exe"
      - name: Sidecar launch probe (Phase 5)
        shell: pwsh
        continue-on-error: true   # evidence collection, not a gate — see known-gap note
        run: |
          $triple = (((rustc -vV) -match '^host: ') -split ' ')[1]
          $bin = "apps/desktop/src-tauri/binaries/jarvis-core-$triple.exe"
          Write-Host "staged sidecar header: $((Get-Content $bin -TotalCount 1))"
          try {
            $p = Start-Process $bin -PassThru -WindowStyle Hidden -Wait -ErrorAction Stop
            Write-Host "SPAWN_OK exit=$($p.ExitCode)"
          } catch {
            Write-Host "SPAWN_FAILED (batch script renamed .exe cannot be executed by CreateProcess): $_"
            Write-Host "KNOWN GAP: Windows sidecar runtime launch is BUILT_NOT_RUNTIME_TESTED until a real Windows launcher exists."
          }
      - name: Build app
        run: npx tauri build --no-bundle
        working-directory: apps/desktop/src-tauri

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Sidecar launch smoke (Phase 5)
        run: |
          STAGE=$(mktemp -d); cp -R dist-core/* "$STAGE"/
          JARVIS_PORT=7902 JARVIS_RUNTIME_DIR="$STAGE/rt" "$STAGE/jarvis-core" > /tmp/core-smoke.log 2>&1 &
          CPID=$!
          code=000
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -m 2 -o /tmp/h.json -w "%{http_code}" http://127.0.0.1:7902/api/health || true)
            [ "$code" = "200" ] && break
          done
          echo "health=$code"; cat /tmp/h.json 2>/dev/null; echo
          kill $CPID 2>/dev/null || true
          [ "$code" = "200" ] || { echo "sidecar smoke failed"; cat /tmp/core-smoke.log; exit 1; }
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp dist-core/jarvis-core "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
          chmod +x "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
      - name: Build app
        run: npx tauri build --no-bundle
        working-directory: apps/desktop/src-tauri
