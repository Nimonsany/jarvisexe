# M10 Phases 6-8 — Windows clean-machine E2E on a fresh GitHub-hosted Windows runner.
# Real installer → real install → real runtime → handshake → health → smoke task
# (graceful prerequisite handling) → quit/relaunch/history → ownership → uninstall.
# Never counts compilation as this test. Runs on a clean ephemeral runner.
name: Windows clean-machine E2E
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v0.1.0-rc5)'
        required: true
        default: 'v0.1.0-rc5'
      run_id:
        description: 'Release workflow run id that built the tag artifacts'
        required: true
        default: '37037329538'

permissions:
  contents: read
  actions: read

jobs:
  clean-machine-e2e:
    name: Windows clean-machine runtime E2E
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Download release installer (from the release run artifact)
        uses: actions/download-artifact@v4
        with:
          name: jarvis-windows
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: dist

      - name: Verify downloaded installer
        shell: pwsh
        run: |
          Get-ChildItem dist | ForEach-Object { Write-Host "downloaded: $($_.Name) $($_.Length)" }
          if (-not (Get-ChildItem dist/*.exe)) { Write-Error "installer not downloaded"; exit 1 }

      - name: Install (NSIS /S — per-user currentUser, no admin elevation)
        shell: pwsh
        run: |
          # Phase 31 seed: user data OUTSIDE the package, written BEFORE install.
          # (opencode is installed later to %USERPROFILE%\.opencode\bin — also
          #  user-local, never owned by the package; both must survive uninstall)
          $seedDir = Join-Path $env:USERPROFILE "jarvis-user-project"
          New-Item -ItemType Directory -Force -Path $seedDir | Out-Null
          $seed = Join-Path $seedDir "keep.txt"
          Set-Content -Path $seed -Value "jarvis user data - must survive uninstall"
          if (-not (Test-Path $seed)) { Write-Host "::error::UNINSTALL_SAFETY: seed file could not be written at $seed"; exit 1 }
          Write-Host "UNINSTALL_SAFETY seed (before install): $seed"
          $exe = (Get-ChildItem dist/JARVIS_*_x64-setup.exe | Select-Object -First 1).FullName
          Write-Host "installing: $exe"
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -Wait -PassThru
          Write-Host "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Error "installer failed with $($p.ExitCode)"; exit 1 }

      - name: Locate installed app (no source-tree dependency)
        shell: pwsh
        run: |
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\jarvis",
            "$env:LOCALAPPDATA\Programs\JARVIS",
            "$env:LOCALAPPDATA\jarvis"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "jarvis-desktop.exe") } | Select-Object -First 1
          if (-not $found) {
            Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | ForEach-Object { Write-Host "programs dir: $($_.Name)" }
            Write-Error "jarvis-desktop.exe not found in any candidate install dir"; exit 1
          }
          "INSTALL_DIR=$found" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "install dir: $found"
          $core = Get-ChildItem $found -Filter "jarvis-core*"
          $core | ForEach-Object { Write-Host "sidecar: $($_.Name) size=$($_.Length)" }
          # sidecar content check: a batch script renamed .exe cannot be spawned by CreateProcess
          $coreExe = $core | Where-Object { $_.Name -eq "jarvis-core.exe" } | Select-Object -First 1
          if ($coreExe) {
            $bytes = [System.IO.File]::ReadAllBytes($coreExe.FullName)[0..1]
            $isPE = ($bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A)
            Write-Host "sidecar starts with MZ (PE executable): $isPE"
            "SIDECAR_IS_PE=$isPE" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host "no jarvis-core.exe in install dir"
            "SIDECAR_IS_PE=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Launch installed JARVIS (app spawns core sidecar)
        shell: pwsh
        run: |
          Start-Process -FilePath (Join-Path $env:INSTALL_DIR "jarvis-desktop.exe")
          Write-Host "launched jarvis-desktop.exe"
          Start-Sleep -Seconds 10
          $spawned = Get-Process -Name "jarvis-core" -ErrorAction SilentlyContinue
          if ($spawned) { Write-Host "SPAWN: core sidecar spawned by the app (pid=$($spawned.Id))" }
          else { Write-Host "SPAWN: core sidecar NOT spawned by the app (check: app logs 'sidecar not found')" }
          Get-Process -Name "jarvis-desktop","jarvis-core" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "process: $($_.ProcessName) pid=$($_.Id)"
          }

      - name: Core startup + identity handshake + health (Phase 7)
        shell: pwsh
        run: |
          $deadline = (Get-Date).AddSeconds(120)
          $health = $null
          while ((Get-Date) -lt $deadline) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:7788/health" -TimeoutSec 5
              break
            } catch { Start-Sleep -Seconds 5 }
          }
          if (-not $health) {
            Write-Host "CORE_STARTUP: FAILED — no core on 7788 after 120s"
            if ($env:SIDECAR_IS_PE -eq "false") {
              Write-Host "ROOT CAUSE (expected M10 hypothesis): sidecar is a batch script renamed .exe — CreateProcess cannot execute it (ERROR_BAD_EXE_FORMAT)"
            }
            # diagnostic: run the launcher DIRECTLY, bounded 12s, capture output
            # (also exercises the Job Object: killing the launcher must kill node)
            Write-Host "--- launcher direct run (bounded 12s, captured) ---"
            $env:JARVIS_PORT = "7788"
            $lp = Start-Process -FilePath (Join-Path $env:INSTALL_DIR "jarvis-core.exe") -RedirectStandardError launcher-err.txt -RedirectStandardOutput launcher-out.txt -PassThru -NoNewWindow
            Start-Sleep -Seconds 12
            if (-not $lp.HasExited) {
              Write-Host "launcher still running after 12s — node alive (now killed: job must close too)"
              Stop-Process -Id $lp.Id -Force
              Start-Sleep -Seconds 3
              $nodeAlive = Get-Process -Name "node" -ErrorAction SilentlyContinue
              if ($nodeAlive) { Write-Host "WARNING: node survived launcher kill — Job Object did not close" }
              else { Write-Host "node died with launcher kill (Job Object works)" }
            } else { Write-Host "launcher exited immediately with code $($lp.ExitCode)" }
            Get-Content launcher-err.txt, launcher-out.txt -ErrorAction SilentlyContinue | Select-Object -First 15 | ForEach-Object { Write-Host "launcher-out: $_" }
            Get-ChildItem (Join-Path $env:INSTALL_DIR "core-runtime") -ErrorAction SilentlyContinue | Select-Object -First 8 | ForEach-Object { Write-Host "core-runtime: $($_.Name)" }
            $node = Get-Command node -ErrorAction SilentlyContinue
            Write-Host "node on PATH: $($node.Source)"
            "CORE_UP=false" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0   # record evidence; later steps assert accordingly
          }
          $health | ConvertTo-Json -Compress | Out-File -FilePath core-health.json
          Write-Host "CORE_STARTUP: OK — $($health | ConvertTo-Json -Compress)"
          "CORE_UP=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          $version = Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/version" -TimeoutSec 5
          $version | ConvertTo-Json -Compress | Out-File -FilePath core-version.json
          Write-Host "HANDSHAKE: $($version | ConvertTo-Json -Compress)"
          $boot = Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/bootstrap" -TimeoutSec 5
          Write-Host "bootstrap token acquired: $($boot.token.Length) chars"
          $boot.token | Out-File -FilePath core-token.txt

      - name: Install opencode (so discovery has a real target)
        shell: pwsh
        if: env.CORE_UP == 'true'
        run: |
          npm install -g opencode-ai 2>&1 | Select-Object -Last 2
          # M10: the npm shim is .cmd/.ps1 (unspawnable without shell) and the
          # discovery's bare names miss Windows forms — find the REAL .exe and
          # copy it to the install dir (the discovery's "bundled" candidate,
          # probed fresh at every task start — no core restart needed).
          $nm = (npm root -g)
          $realExe = Get-ChildItem "$nm/opencode-ai" -Recurse -Filter "opencode.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $realExe) { $realExe = Get-ChildItem "$env:USERPROFILE\.opencode\bin" -Filter "opencode.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if ($realExe) {
            # copy to opencode's standard user-local install location — the
            # discovery's user-local candidate (with .exe variant probing, M10)
            # finds it at task time; the running core re-probes per task
            New-Item -ItemType Directory -Force -Path "$env:USERPROFILE\.opencode\bin" | Out-Null
            Copy-Item $realExe.FullName "$env:USERPROFILE\.opencode\bin\opencode.exe"
            Write-Host "opencode real binary installed to user-local: $env:USERPROFILE\.opencode\bin\opencode.exe"
          } else {
            Write-Host "no opencode.exe found — shim layout (graceful path will be tested):"
            Get-ChildItem C:\npm\prefix\opencode* -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "shim: $($_.Name)" }
          }

      - name: Smoke task — deterministic, harmless (Phase 7 + 18 + 19)
        shell: pwsh
        if: env.CORE_UP == 'true'
        run: |
          $token = (Get-Content core-token.txt -Raw).Trim()
          $headers = @{ Authorization = "Bearer $token" }
          $body = @{
            request = "Create a temporary file named j10-windows-ok.txt in the project directory containing exactly the text JARVIS_WINDOWS_RUNTIME_OK (plain, unquoted). Create no other files."
            project = $env:RUNNER_TEMP
          } | ConvertTo-Json
          $task = Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/task" -Method Post -Headers $headers -ContentType "application/json" -Body $body -TimeoutSec 30
          $id = $task.id
          Write-Host "task created: $id"
          "SMOKE_TASK_ID=$id" | Out-File -FilePath $env:GITHUB_ENV -Append
          $smokeOutcome = ""
          # observe: terminal state, or the Phase-19 login wait (the ask waits
          # up to 5min for a manual ChatGPT login — nobody logs in on a clean
          # runner, so after a bounded observation window we exercise the
          # documented STOP path: cancel → CANCELLED)
          $deadline = (Get-Date).AddSeconds(600)
          $status = ""
          while ((Get-Date) -lt $deadline) {
            $t = Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/task/$id" -Headers $headers -TimeoutSec 10
            $status = $t.task.status
            if ($status -in @("COMPLETED","FAILED","CANCELLED","WAITING_FOR_OWNER","WAITING_FOR_CHATGPT")) { break }
            Start-Sleep -Seconds 10
          }
          if ($status -eq "WAITING_FOR_CHATGPT") {
            Write-Host "PHASE 19: ChatGPT login required identified — task waits for a manual login (correct behavior on a clean machine)"
            Write-Host "exercising the documented STOP path: cancel"
            $c = Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/task/$id/cancel" -Method Post -Headers $headers -TimeoutSec 15
            Write-Host "cancel → status: $($c.status)"
            $smokeOutcome = "login-required-cancelled"
            "SMOKE=login-required-cancelled" | Out-File -FilePath $env:GITHUB_ENV -Append
            "SMOKE_TASK_ID=$id" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          Write-Host "task terminal status: $status"
          $t = Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/task/$id" -Headers $headers -TimeoutSec 10
          $t | ConvertTo-Json -Depth 5 -Compress | Out-File -FilePath smoke-task.json
          Write-Host "last_error: $($t.task.last_error)"
          if ($status -eq "COMPLETED") {
            $f = Join-Path $env:RUNNER_TEMP "j10-windows-ok.txt"
            $content = (Get-Content $f -Raw).Trim()
            Write-Host "smoke file content: $content"
            if ($content -ne "JARVIS_WINDOWS_RUNTIME_OK") { Write-Error "smoke file content mismatch"; exit 1 }
            "SMOKE=completed" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ($status -in @("FAILED","WAITING_FOR_OWNER")) {
            Write-Host "SMOKE: failed gracefully (expected on a clean machine without ChatGPT credentials — Phase 18/19 behavior)"
            "SMOKE=graceful-fail" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ($smokeOutcome -eq "login-required-cancelled") {
            Write-Host "SMOKE: Phase-19 login wait observed + documented cancel exercised cleanly"
          } else {
            Write-Error "task did not reach a terminal state in 600s (status=$status) — hang, not graceful"; exit 1
          }

      - name: Quit → relaunch → history present (Phase 7 + 29)
        shell: pwsh
        if: env.CORE_UP == 'true'
        run: |
          # any terminating error in this step must surface as a real failure
          trap { Write-Host "::error::CRASH_RECOVERY: FAIL — $($_.Exception.Message)"; exit 1 }
          function Wait-CoreHealth {
            param([int]$Seconds = 120)
            $end = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $end) {
              try { $null = Invoke-RestMethod -Uri "http://127.0.0.1:7788/health" -TimeoutSec 5; return $true } catch { Start-Sleep -Seconds 5 }
            }
            return $false
          }
          # GRACEFUL quit first: CloseMainWindow() = WM_CLOSE → Tauri fires
          # ExitRequested → the exit handler kills the core sidecar (group kill on
          # unix; launcher kill → Job Object close on Windows). Stop-Process -Force
          # would be an ABNORMAL quit and skip the exit handler entirely.
          (Get-Process -Name "jarvis-desktop" -ErrorAction SilentlyContinue).CloseMainWindow() | Out-Null
          Start-Sleep -Seconds 8
          $coreAlive = Get-Process -Name "jarvis-core" -ErrorAction SilentlyContinue
          if ($coreAlive) {
            Write-Host "WARNING: core sidecar survived graceful quit"
            $coreAlive | ForEach-Object { Write-Host "surviving core pid=$($_.Id)" }
          } else { Write-Host "core sidecar died with graceful quit" }

          # CRASH path (Phase 29): the old block force-killed AFTER the graceful
          # quit had already stopped everything — a no-op kill proves nothing.
          # Relaunch first so the kill targets a LIVE runtime with an IN-FLIGHT task.
          Start-Process -FilePath (Join-Path $env:INSTALL_DIR "jarvis-desktop.exe")
          if (-not (Wait-CoreHealth -Seconds 120)) {
            Write-Host "::error::CRASH_RECOVERY: FAIL (state=pre-kill-health-timeout) — core never came up before the crash test"
            exit 1
          }
          $token = (Get-Content core-token.txt -Raw).Trim()
          $headers = @{ Authorization = "Bearer $token" }
          $crashBody = @{
            request = "Crash-recovery probe: create a temporary file named j10-crash.txt in the project directory containing exactly the text JARVIS_CRASH_RECOVERY (plain, unquoted). Create no other files."
            project = $env:RUNNER_TEMP
          } | ConvertTo-Json
          try {
            $ct = Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/task" -Method Post -Headers $headers -ContentType "application/json" -Body $crashBody -TimeoutSec 35
          } catch {
            Write-Host "::error::CRASH_RECOVERY: FAIL (state=task-create-failed) — $($_.Exception.Message)"
            exit 1
          }
          $crashId = $ct.id
          Write-Host "crash task created: $crashId pre-kill status=$($ct.status)"
          Start-Sleep -Seconds 5
          # both processes must be provably alive RIGHT BEFORE the kill
          $dProc = Get-Process -Name "jarvis-desktop" -ErrorAction SilentlyContinue
          $cProc = Get-Process -Name "jarvis-core" -ErrorAction SilentlyContinue
          if (-not $dProc -or -not $cProc) {
            Write-Host "::error::CRASH_RECOVERY: FAIL (state=$($ct.status)) — pre-kill liveness: desktop=$([bool]$dProc) core=$([bool]$cProc)"
            exit 1
          }
          Write-Host "pre-kill: jarvis-desktop pid=$($dProc.Id) jarvis-core pid=$($cProc.Id)"
          # killing the desktop may take the core down with it (Job Object) —
          # attempt both, report any refusal, then assert the real outcome below
          @($dProc) + @($cProc) | ForEach-Object {
            try { Stop-Process -Id $_.Id -Force -ErrorAction Stop }
            catch { Write-Host "kill note: $($_.Exception.Message)" }
          }
          Start-Sleep -Seconds 3
          $survivors = @(Get-Process -Name "jarvis-desktop","jarvis-core" -ErrorAction SilentlyContinue)
          if ($survivors.Count -gt 0) {
            $survivors | ForEach-Object { Write-Host "::error::CRASH_RECOVERY: FAIL — $($_.ProcessName) pid=$($_.Id) survived force-kill" }
            exit 1
          }
          Write-Host "post-kill: jarvis-desktop and jarvis-core both gone"
          # relaunch + wait for recovery
          Start-Process -FilePath (Join-Path $env:INSTALL_DIR "jarvis-desktop.exe")
          if (-not (Wait-CoreHealth -Seconds 120)) {
            Write-Host "::error::CRASH_RECOVERY: FAIL (state=$($ct.status)) — core not healthy 120s after crash relaunch"
            exit 1
          }
          $tasks = @(Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/tasks" -Headers $headers -TimeoutSec 10)
          Write-Host "history after relaunch: $($tasks.Count) task(s)"
          $tasks | ConvertTo-Json -Depth 3 -Compress | Out-File -FilePath history.json
          # documented recovery outcome: print the ACTUAL status, never assume one
          $hit = @($tasks | Where-Object { $_.id -eq $crashId }) | Select-Object -First 1
          $state = if ($hit) { [string]$hit.status } else { "<missing>" }
          $docStates = @('NEW','PLANNING','WAITING_FOR_CHATGPT','PLAN_RECEIVED','PREPARING_EXECUTION','EXECUTING','MONITORING','TESTING','VERIFYING','DEBUGGING','WAITING_FOR_OWNER','PAUSED','FAILED','COMPLETED','CANCELLED')
          $cores = @(Get-Process -Name "jarvis-core" -ErrorAction SilentlyContinue)
          $desktops = @(Get-Process -Name "jarvis-desktop" -ErrorAction SilentlyContinue)
          $procs = Get-Process -Name "jarvis-desktop","jarvis-core" -ErrorAction SilentlyContinue
          $procs | ForEach-Object { Write-Host "live after relaunch: $($_.ProcessName) pid=$($_.Id)" }
          $histOk = ($null -ne $hit) -and ($state -in $docStates)
          $coreOk = ($cores.Count -eq 1)          # exactly one core — no orphaned extra core
          $deskOk = ($desktops.Count -ge 1)
          if ($histOk -and $coreOk -and $deskOk) {
            Write-Host "CRASH_RECOVERY: PASS (state=$state)"
          } else {
            Write-Host "::error::CRASH_RECOVERY: FAIL (state=$state) in_history=$($null -ne $hit) documented=$($state -in $docStates) jarvis_core_count=$($cores.Count) jarvis_desktop_count=$($desktops.Count)"
            exit 1
          }

      - name: Reinstall over existing install (Phase 30)
        shell: pwsh
        if: env.CORE_UP == 'true'
        run: |
          trap { Write-Host "::error::REINSTALL: FAIL — $($_.Exception.Message)"; exit 1 }
          function Wait-CoreHealth {
            param([int]$Seconds = 120)
            $end = (Get-Date).AddSeconds($Seconds)
            while ((Get-Date) -lt $end) {
              try { $null = Invoke-RestMethod -Uri "http://127.0.0.1:7788/health" -TimeoutSec 5; return $true } catch { Start-Sleep -Seconds 5 }
            }
            return $false
          }
          $token = (Get-Content core-token.txt -Raw).Trim()
          $headers = @{ Authorization = "Bearer $token" }
          # snapshot history BEFORE the reinstall — it must survive it
          $preIds = @(Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/tasks" -Headers $headers -TimeoutSec 10 | ForEach-Object { $_.id })
          Write-Host "REINSTALL: task ids before reinstall: $($preIds -join ' ')"
          if ($preIds.Count -eq 0) { Write-Host "::error::REINSTALL: FAIL — no task history to prove preservation against"; exit 1 }
          # quit first so NSIS never copies over locked files, then force-kill leftovers
          $running = @(Get-Process -Name "jarvis-desktop" -ErrorAction SilentlyContinue)
          if ($running.Count -gt 0) {
            $running | ForEach-Object { $_.CloseMainWindow() | Out-Null }
            Start-Sleep -Seconds 8
          }
          Get-Process -Name "jarvis-desktop","jarvis-core" -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          $exe = (Get-ChildItem dist/JARVIS_*_x64-setup.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList "/S" -Wait -PassThru
          Write-Host "REINSTALL: second silent install exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { Write-Host "::error::REINSTALL: FAIL — installer exit $($p.ExitCode)"; exit 1 }
          Start-Process -FilePath (Join-Path $env:INSTALL_DIR "jarvis-desktop.exe")
          if (-not (Wait-CoreHealth -Seconds 120)) {
            Write-Host "::error::REINSTALL: FAIL — core not healthy after reinstall relaunch"
            exit 1
          }
          $postIds = @(Invoke-RestMethod -Uri "http://127.0.0.1:7788/api/tasks" -Headers $headers -TimeoutSec 10 | ForEach-Object { $_.id })
          $missing = @($preIds | Where-Object { $_ -notin $postIds })
          Write-Host "REINSTALL: task ids after reinstall: $($postIds -join ' ') (missing: $(if ($missing) { $missing -join ' ' } else { 'none' }))"
          $cores = @(Get-Process -Name "jarvis-core" -ErrorAction SilentlyContinue)
          Write-Host "REINSTALL: jarvis-core processes after relaunch: $($cores.Count)"
          if ($missing.Count -gt 0) { Write-Host "::error::REINSTALL: FAIL — task history lost after reinstall (missing: $($missing -join ' '))"; exit 1 }
          if ($cores.Count -ne 1) { Write-Host "::error::REINSTALL: FAIL — jarvis-core count is $($cores.Count) after reinstall relaunch"; exit 1 }
          Write-Host "REINSTALL: PASS (exit 0, health OK, $($postIds.Count) task(s) preserved)"

      - name: Process ownership (Phase 8) — unrelated process survives
        shell: pwsh
        run: |
          Start-Process -FilePath "notepad.exe"
          Start-Sleep -Seconds 3
          # stop every JARVIS-owned process by exact image name
          Get-Process -Name "jarvis-desktop","jarvis-core" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          $notepad = Get-Process -Name "notepad" -ErrorAction SilentlyContinue
          if ($notepad) { Write-Host "OWNERSHIP: PASS — unrelated notepad survived (pid=$($notepad.Id))" }
          else { Write-Error "OWNERSHIP: FAIL — unrelated notepad was killed"; exit 1 }

      - name: Uninstall (Phase 7/31) — owned resources cleaned
        shell: pwsh
        run: |
          # what must SURVIVE the uninstall (asserted again after it runs)
          $seed = Join-Path $env:USERPROFILE "jarvis-user-project\keep.txt"
          $seedPre = Test-Path $seed
          $oc = Join-Path $env:USERPROFILE ".opencode\bin\opencode.exe"
          $ocPre = Test-Path $oc
          Write-Host "before uninstall: seed=$seedPre ($seed) opencode=$ocPre ($oc)"
          if (-not $ocPre) { Write-Host "note: opencode.exe absent before uninstall — survival claim not claimable (see opencode install step)" }
          $un = Join-Path $env:INSTALL_DIR "uninstall.exe"
          if (Test-Path $un) {
            $p = Start-Process -FilePath $un -ArgumentList "/S" -Wait -PassThru
            Write-Host "uninstaller exit: $($p.ExitCode)"
          } else {
            Write-Host "no uninstall.exe at $env:INSTALL_DIR — enumerating"
            Get-ChildItem $env:INSTALL_DIR -ErrorAction SilentlyContinue | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }
          }
          Start-Sleep -Seconds 5
          $dirGone = -not (Test-Path (Join-Path $env:INSTALL_DIR "jarvis-desktop.exe"))
          Write-Host "install dir removed: $dirGone"
          $procs = Get-Process -Name "jarvis-desktop","jarvis-core" -ErrorAction SilentlyContinue
          if ($procs) { Write-Host "WARNING: JARVIS processes survived uninstall" } else { Write-Host "no JARVIS processes after uninstall" }
          # Phase 31: package files go, user data and user-local tooling stay
          $seedPost = Test-Path $seed
          $ocPost = Test-Path $oc
          Write-Host "after uninstall: seed=$seedPost opencode=$ocPost"
          $safe = $dirGone -and $seedPost -and ((-not $ocPre) -or $ocPost)
          if ($safe) {
            Write-Host "UNINSTALL_SAFETY: PASS"
          } else {
            Write-Host "::error::UNINSTALL_SAFETY: FAIL (install_dir_removed=$dirGone seed_survived=$seedPost opencode_survived=$ocPost opencode_pre=$ocPre)"
            exit 1
          }

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-e2e-evidence
          path: |
            core-health.json
            core-version.json
            smoke-task.json
            history.json
          if-no-files-found: ignore
