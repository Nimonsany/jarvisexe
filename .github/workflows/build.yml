name: JARVIS CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  test:
    name: Test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Typecheck core
        run: npx tsc --noEmit -p packages/core/tsconfig.json
      - name: Typecheck desktop
        run: npx tsc --noEmit
        working-directory: apps/desktop
      - name: Unit tests (state machine, parser, sanitizer, supervisor)
        run: npx tsx --test tests/*.test.ts
      - name: Computer-control unit tests
        run: npx tsx tests/computer.test.mts
      - name: Voice unit tests
        run: npx tsx tests/voice.test.mts
      - name: Frontend tests
        run: npx vitest run
        working-directory: apps/desktop

  build-macos:
    name: macOS (DMG)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp dist-core/jarvis-core "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
          chmod +x "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
      - name: Build app + DMG
        run: npx tauri build
        working-directory: apps/desktop/src-tauri
        env: { TAURI_SIGNING_PRIVATE_KEY: '' }
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app

  build-windows:
    name: Windows (EXE/MSI)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary
        shell: pwsh
        run: |
          $triple = (((rustc -vV) -match '^host: ') -split ' ')[1]
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item dist-core/jarvis-core.cmd "apps/desktop/src-tauri/binaries/jarvis-core-$triple.exe"
      - name: Build app (NSIS/MSI)
        run: npx tauri build
        working-directory: apps/desktop/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi

  build-linux:
    name: Linux (AppImage/DEB)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp dist-core/jarvis-core "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
          chmod +x "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
      - name: Build AppImage + DEB
        run: npx tauri build
        working-directory: apps/desktop/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
