# RELEASE — deliberate packaging + draft GitHub Release.
# Triggers (M9 Phase 2): version tags (v*) or manual dispatch.
# Dispatch builds installers as workflow artifacts only; tag pushes also
# attach everything to a DRAFT release (published manually after verification).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    name: Gate (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Typecheck core
        run: npx tsc --noEmit -p packages/core/tsconfig.json
      - name: Typecheck desktop
        run: npx tsc --noEmit
        working-directory: apps/desktop
      - name: Secret scan (tracked files)
        run: |
          if git grep -nIE "BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-" -- \
              ':(exclude)tests/sanitize.test.ts' ':(exclude)tests/security-hardening.test.mts'; then
            echo "secret-like pattern found in tracked files" >&2
            exit 1
          fi
      - name: Dependency audit (production)
        run: npm audit --omit=dev
      - name: SBOM (Phase 24)
        run: npm sbom --sbom-format spdx --omit=dev > sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Rust dependency audit (Phase 25)
        uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
        working-directory: apps/desktop/src-tauri
      - name: Unit + integration tests
        run: npx tsx --test tests/*.test.ts tests/*.mts
      - name: Frontend tests
        run: npx vitest run
        working-directory: apps/desktop

  package-macos:
    name: macOS DMG
    runs-on: macos-latest
    needs: test
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary (host triple)
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp dist-core/jarvis-core "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
          chmod +x "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
      - name: Build app + DMG
        run: npx tauri build --bundles app,dmg
        working-directory: apps/desktop/src-tauri
      - name: Name artifact (product_version_arch)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version"); fi
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          case "$TRIPLE" in aarch64-apple-darwin) ARCH=arm64;; x86_64-apple-darwin) ARCH=x86_64;; *) ARCH="$TRIPLE";; esac
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg "dist/JARVIS_${VER}_${ARCH}.dmg"
          # updater artifacts (createUpdaterArtifacts) — required for latest.json
          TGZ=$(ls apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz | head -1)
          cp "$TGZ" "dist/JARVIS_${VER}_macos-${ARCH}.app.tar.gz"
          cp "$TGZ.sig" "dist/JARVIS_${VER}_macos-${ARCH}.app.tar.gz.sig"
          # signing evidence (ad-hoc/unsigned vs Developer ID)
          APP=$(ls -d apps/desktop/src-tauri/target/release/bundle/macos/*.app | head -1)
          codesign -dv "$APP" > dist/macos-codesign.txt 2>&1 || true
          echo "VER=$VER ARCH=$ARCH" >> "$GITHUB_ENV"
      - name: Build info (manifest)
        run: python3 scripts/release/build-info.py macos "$ARCH"
      - name: Artifact inspection (Phase 26)
        run: python3 scripts/release/inspect-artifact.py dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos
          path: dist/*
          if-no-files-found: error

  package-windows:
    name: Windows NSIS + MSI
    runs-on: windows-latest
    needs: test
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary (host triple)
        shell: pwsh
        run: |
          $triple = (((rustc -vV) -match '^host: ') -split ' ')[1]
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item dist-core/jarvis-core.cmd "apps/desktop/src-tauri/binaries/jarvis-core-$triple.exe"
      - name: Build NSIS (primary)
        run: npx tauri build --bundles nsis --config "{\"bundle\":{\"windows\":{\"nsis\":{\"installMode\":\"currentUser\"}}}}"
        working-directory: apps/desktop/src-tauri
      - name: Build MSI (secondary, non-blocking)
        continue-on-error: true
        run: npx tauri build --bundles msi
        working-directory: apps/desktop/src-tauri
      - name: Name artifacts
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF_TYPE" -eq "tag") { $ver = $env:GITHUB_REF_NAME.Substring(1) }
          else { $ver = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $nsis = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $nsis) { Write-Error "NSIS installer not produced"; exit 1 }
          Copy-Item $nsis.FullName "dist/JARVIS_${ver}_x64-setup.exe"
          $nsisSig = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsisSig) { Write-Error "NSIS updater signature (.sig) missing — updater build not signed"; exit 1 }
          Copy-Item $nsisSig.FullName "dist/JARVIS_${ver}_x64-setup.exe.sig"
          $msi = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName "dist/JARVIS_${ver}_x64.msi" } else { Write-Warning "MSI not produced (secondary)" }
      - name: Build info (manifest)
        shell: pwsh
        run: python scripts/release/build-info.py windows x64
      - name: Artifact inspection (Phase 26)
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/*.exe, dist/*.msi -ErrorAction SilentlyContinue | ForEach-Object FullName
          python scripts/release/inspect-artifact.py $files
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: dist/*
          if-no-files-found: error

  package-linux:
    name: Linux AppImage + DEB
    runs-on: ubuntu-latest
    needs: test
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary (host triple)
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp dist-core/jarvis-core "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
          chmod +x "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
      - name: Build AppImage + DEB
        run: npx tauri build --bundles appimage,deb
        working-directory: apps/desktop/src-tauri
      - name: Name artifacts
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version"); fi
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage "dist/JARVIS_${VER}_amd64.AppImage"
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig "dist/JARVIS_${VER}_amd64.AppImage.sig"
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb "dist/JARVIS_${VER}_amd64.deb"
          file dist/* > dist/build-filetypes.txt
      - name: Build info (manifest)
        run: python3 scripts/release/build-info.py linux amd64
      - name: Artifact inspection (Phase 26)
        run: python3 scripts/release/inspect-artifact.py dist/*.AppImage dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [package-macos, package-windows, package-linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Updater metadata (static latest.json)
        env:
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download
        run: |
          python3 - <<'PY'
          import json, glob, os
          tag = os.environ['GITHUB_REF_NAME']
          ver = tag[1:] if tag.startswith('v') else tag
          base = os.environ['RELEASE_BASE'] + '/' + tag
          names = sorted(os.path.basename(f) for f in glob.glob('dist/*'))
          def pick(suffix, arch_hint=None):
              for n in names:
                  if n.endswith(suffix) and (arch_hint is None or arch_hint in n):
                      return n
              return None
          plats = {}
          mac = pick('.app.tar.gz')
          nsis = pick('_x64-setup.exe')
          ai = pick('_amd64.AppImage')
          if mac and os.path.exists(f'dist/{mac}.sig'):
              arch = 'aarch64' if 'arm64' in mac else 'x86_64'
              plats[f'darwin-{arch}'] = {'url': f'{base}/{mac}',
                                          'signature': open(f'dist/{mac}.sig').read().strip()}
          if nsis and os.path.exists(f'dist/{nsis}.sig'):
              plats['windows-x86_64'] = {'url': f'{base}/{nsis}',
                                          'signature': open(f'dist/{nsis}.sig').read().strip()}
          if ai and os.path.exists(f'dist/{ai}.sig'):
              plats['linux-x86_64'] = {'url': f'{base}/{ai}',
                                        'signature': open(f'dist/{ai}.sig').read().strip()}
          missing = [k for k in ('darwin-aarch64', 'windows-x86_64', 'linux-x86_64') if k not in plats]
          if missing:
              raise SystemExit(f'missing updater platform entries: {missing}')
          json.dump({'version': ver, 'notes': f'JARVIS {ver}', 'platforms': plats},
                    open('dist/latest.json', 'w'), indent=2)
          print('latest.json written:', ver, sorted(plats))
          PY
      - name: Release manifest (Phase 22)
        run: python3 scripts/release/release-manifest.py dist "$GITHUB_REF_NAME"
      - name: SHA256 checksums (verify before upload)
        run: |
          cd dist
          sha256sum $(ls | grep -v '^SHA256SUMS.txt$') > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=docs/RELEASE_NOTES.md
          if [ -f "$NOTES" ]; then
            sed "s/<version>/${GITHUB_REF_NAME}/g" "$NOTES" > /tmp/release-notes.md
            NOTES=/tmp/release-notes.md
          else
            NOTES=""
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --title "JARVIS $GITHUB_REF_NAME" \
            ${NOTES:+--notes-file "$NOTES"} \
            ${NOTES:---generate-notes}
