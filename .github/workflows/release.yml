# RELEASE — deliberate packaging + draft GitHub Release.
# Triggers (M9 Phase 2): version tags (v*) or manual dispatch.
# Dispatch builds installers as workflow artifacts only; tag pushes also
# attach everything to a DRAFT release (published manually after verification).
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  test:
    name: Gate (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Typecheck core
        run: npx tsc --noEmit -p packages/core/tsconfig.json
      - name: Typecheck desktop
        run: npx tsc --noEmit
        working-directory: apps/desktop
      - name: Secret scan (tracked files)
        run: |
          if git grep -nIE "BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|xox[baprs]-" -- \
              ':(exclude)tests/sanitize.test.ts' ':(exclude)tests/security-hardening.test.mts'; then
            echo "secret-like pattern found in tracked files" >&2
            exit 1
          fi
      - name: Dependency audit (production)
        run: npm audit --omit=dev
      - name: SBOM (Phase 24)
        run: npm sbom --sbom-format spdx --omit=dev > sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
      - name: Rust dependency audit (Phase 25)
        uses: taiki-e/install-action@cargo-audit
      - name: cargo audit
        run: cargo audit
        working-directory: apps/desktop/src-tauri
      - name: Unit + integration tests
        run: npx tsx --test tests/*.test.ts tests/*.mts
      - name: Frontend tests
        run: npx vitest run
        working-directory: apps/desktop

  package-macos:
    name: macOS DMG
    runs-on: macos-latest
    needs: test
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary (host triple)
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp dist-core/jarvis-core "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
          chmod +x "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
      # Phase 14 — Developer ID signing. Runs unconditionally so the skip log line
      # always appears; only imports a keychain when both cert secrets are present.
      - name: "Signing: setup (Phase 14)"
        env:
          MACOS_DEVELOPER_ID_CERT_P12: ${{ secrets.MACOS_DEVELOPER_ID_CERT_P12 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PROFILE: ${{ secrets.KEYCHAIN_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_DEVELOPER_ID_CERT_P12:-}" ] || [ -z "${MACOS_DEVELOPER_ID_CERT_PASSWORD:-}" ]; then
            echo "Signing: skipped (credentials not configured)"
            echo "SIGNING_ACTIVE=false" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Signing: importing Developer ID certificate into a temporary keychain"
          KC="$RUNNER_TEMP/jarvis-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          security create-keychain -p "$KC_PASS" "$KC"
          echo "KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$MACOS_DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/jarvis-cert.p12"
          security import "$RUNNER_TEMP/jarvis-cert.p12" -k "$KC" -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/jarvis-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(.*\)"/\1/p' | grep -m1 'Developer ID Application' || true)"
          if [ -z "$IDENTITY" ]; then
            IDENTITY="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(.*\)"/\1/p' | grep -m1 . || true)"
          fi
          if [ -z "$IDENTITY" ]; then
            echo "::error::Developer ID certificate imported but no codesigning identity found"
            exit 1
          fi
          echo "Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGNING_ACTIVE=true" >> "$GITHUB_ENV"
          echo "Signing: credentials configured (Developer ID pipeline active)"
      - name: Build app + DMG
        run: npx tauri build --bundles app,dmg
        working-directory: apps/desktop/src-tauri
      - name: Name artifact (product_version_arch)
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version"); fi
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          case "$TRIPLE" in aarch64-apple-darwin) ARCH=arm64;; x86_64-apple-darwin) ARCH=x86_64;; *) ARCH="$TRIPLE";; esac
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg "dist/JARVIS_${VER}_${ARCH}.dmg"
          # updater artifacts (createUpdaterArtifacts) — required for latest.json
          TGZ=$(ls apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz | head -1)
          cp "$TGZ" "dist/JARVIS_${VER}_macos-${ARCH}.app.tar.gz"
          cp "$TGZ.sig" "dist/JARVIS_${VER}_macos-${ARCH}.app.tar.gz.sig"
          # signing evidence (ad-hoc/unsigned vs Developer ID)
          APP=$(ls -d apps/desktop/src-tauri/target/release/bundle/macos/*.app | head -1)
          codesign -dv "$APP" > dist/macos-codesign.txt 2>&1 || true
          echo "VER=$VER ARCH=$ARCH" >> "$GITHUB_ENV"
      # Phase 14 — verify Developer ID signature + hardened runtime. Gated on signing
      # having run; when secrets are absent the step is a no-op so the unsigned build
      # path is unchanged.
      - name: Verify code signature (Phase 14)
        run: |
          set -euo pipefail
          if [ "${SIGNING_ACTIVE:-false}" != "true" ]; then
            echo "Signature verification: skipped (credentials not configured)"
            exit 0
          fi
          APP=$(ls -d apps/desktop/src-tauri/target/release/bundle/macos/*.app | head -1)
          echo "== codesign --verify --deep --strict =="
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "== codesign -dv (authority chain + runtime flag) =="
          codesign -dv --verbose=4 "$APP" 2>&1 | tee dist/macos-codesign.txt
          echo "== assertions =="
          grep -q "Authority=Developer ID Application" dist/macos-codesign.txt \
            || { echo "::error::signer is not a Developer ID Application identity"; exit 1; }
          grep -q "flags=.*runtime" dist/macos-codesign.txt \
            || { echo "::error::hardened runtime flag (0x10000) missing"; exit 1; }
          echo "Developer ID signature verified with hardened runtime"
      # Phase 15 — notarization + Gatekeeper. All gated: missing secrets => skip log,
      # identical behavior to today. spctl --type execute only passes once notarized,
      # so both spctl checks live here (after stapling) rather than in Phase 14.
      - name: Notarize + Gatekeeper (Phase 15)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PROFILE: ${{ secrets.KEYCHAIN_PROFILE }}
        run: |
          set -euo pipefail
          HAVE_CREDS=false
          if [ -n "${KEYCHAIN_PROFILE:-}" ] || { [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; }; then
            HAVE_CREDS=true
          fi
          if [ "${SIGNING_ACTIVE:-false}" != "true" ] || [ "$HAVE_CREDS" != "true" ]; then
            echo "Notarization: skipped (credentials not configured)"
            exit 0
          fi
          APP=$(ls -d apps/desktop/src-tauri/target/release/bundle/macos/*.app | head -1)
          DMG=$(ls dist/*.dmg | head -1)
          echo "== notarytool submit ($DMG) =="
          if [ -n "${KEYCHAIN_PROFILE:-}" ]; then
            xcrun notarytool submit "$DMG" --keychain-profile "$KEYCHAIN_PROFILE" --wait
          else
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          fi
          echo "== stapler staple =="
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "== spctl Gatekeeper =="
          spctl --assess --type install --verbose=2 "$DMG"
          spctl --assess --type execute --verbose=2 "$APP"
          echo "Notarization complete, stapled and Gatekeeper-verified"
      - name: Build info (manifest)
        run: python3 scripts/release/build-info.py macos "$ARCH"
      - name: Artifact inspection (Phase 26)
        run: python3 scripts/release/inspect-artifact.py dist/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-macos
          path: dist/*
          if-no-files-found: error
      # Phase 14 — always remove the temp keychain (even when earlier steps fail) so no
      # private key material survives the job. No-op when signing was skipped.
      - name: Cleanup temporary signing keychain (always)
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" && echo "deleted temporary signing keychain"
          else
            echo "no temporary keychain to clean up"
          fi

  package-windows:
    name: Windows NSIS + MSI
    runs-on: windows-latest
    needs: test
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary (host triple)
        shell: pwsh
        run: |
          $triple = (((rustc -vV) -match '^host: ') -split ' ')[1]
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/binaries | Out-Null
          # M10 Phase 6: a batch script renamed .exe cannot be spawned by CreateProcess
          # (ERROR_BAD_EXE_FORMAT) — confirmed by the Windows clean-machine E2E — so the
          # sidecar is a REAL .exe launcher (csc ships with every Windows runner) with a
          # Job Object (kill-on-close) for orphan-safe app-quit.
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /out:"apps\desktop\src-tauri\binaries\jarvis-core-$triple.exe" "scripts\release\jarvis-core-launcher.cs"
          if ($LASTEXITCODE -ne 0) { Write-Error "csc compile failed"; exit 1 }
          Get-Item "apps/desktop/src-tauri/binaries/jarvis-core-$triple.exe" | ForEach-Object { Write-Host "sidecar built: $($_.Name) $($_.Length) bytes" }
      # Phase 16 — Windows Authenticode. Decodes the base64 pfx, imports it into the
      # runner cert store and exposes Tauri's bundle.windows signing config only when
      # both secrets are present. With secrets absent the build configs are byte-for-byte
      # what they are today, so the unsigned path is unchanged.
      - name: "Signing: setup (Phase 16)"
        shell: pwsh
        env:
          WINDOWS_PFX: ${{ secrets.WINDOWS_PFX }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $nsis = '{"bundle":{"windows":{"nsis":{"installMode":"currentUser"}}}}'
          $msi = ''
          if (-not $env:WINDOWS_PFX -or -not $env:WINDOWS_PFX_PASSWORD) {
            Write-Host "Signing: skipped (credentials not configured)"
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP 'jarvis-codesign.pfx'
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX))
              $secure = ConvertTo-SecureString $env:WINDOWS_PFX_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation 'Cert:\CurrentUser\My' -Password $secure | Select-Object -Last 1
              $t = $cert.Thumbprint
              if (-not $t) { throw "pfx imported but no thumbprint returned" }
              $sign = '"certificateThumbprint":"' + $t + '","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com","tsp":true'
              $nsis = '{"bundle":{"windows":{"nsis":{"installMode":"currentUser"},' + $sign + '}}}'
              $msi  = '{"bundle":{"windows":{' + $sign + '}}}'
              "WINDOWS_SIGN_ACTIVE=true" | Out-File -Append -FilePath $env:GITHUB_ENV
              Write-Host "Signing: certificate imported (thumbprint $t) — tauri signs sidecar, main exe and installers"
            } finally {
              Remove-Item $pfx -ErrorAction SilentlyContinue
            }
          }
          "NSIS_CONFIG=$nsis" | Out-File -Append -FilePath $env:GITHUB_ENV
          "MSI_CONFIG=$msi" | Out-File -Append -FilePath $env:GITHUB_ENV
      - name: Build NSIS (primary)
        shell: pwsh
        run: npx tauri build --bundles nsis --config $env:NSIS_CONFIG
        working-directory: apps/desktop/src-tauri
      - name: Build MSI (secondary, non-blocking)
        continue-on-error: true
        shell: pwsh
        run: |
          if ($env:MSI_CONFIG) {
            npx tauri build --bundles msi --config $env:MSI_CONFIG
          } else {
            npx tauri build --bundles msi
          }
        working-directory: apps/desktop/src-tauri
      - name: Name artifacts
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF_TYPE" -eq "tag") { $ver = $env:GITHUB_REF_NAME.Substring(1) }
          else { $ver = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $nsis = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $nsis) { Write-Error "NSIS installer not produced"; exit 1 }
          Copy-Item $nsis.FullName "dist/JARVIS_${ver}_x64-setup.exe"
          $nsisSig = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsisSig) { Write-Error "NSIS updater signature (.sig) missing — updater build not signed"; exit 1 }
          Copy-Item $nsisSig.FullName "dist/JARVIS_${ver}_x64-setup.exe.sig"
          $msi = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName "dist/JARVIS_${ver}_x64.msi" } else { Write-Warning "MSI not produced (secondary)" }
      # Phase 16 — verify Authenticode on the installers. Gated, no-op when signing skipped.
      - name: Verify Authenticode signature (Phase 16)
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGN_ACTIVE -ne 'true') {
            Write-Host "Windows signature verification: skipped (credentials not configured)"
            exit 0
          }
          $targets = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $targets) { throw "no installers found in dist/" }
          foreach ($t in $targets) {
            $s = Get-AuthenticodeSignature -FilePath $t.FullName
            Write-Host ("{0}: {1} ({2})" -f $t.Name, $s.Status, $s.SignerCertificate.Subject)
            if ($s.Status -ne 'Valid') { throw "signature verification failed: $($t.Name)" }
          }
          Write-Host "Authenticode signature verified"
      - name: Build info (manifest)
        shell: pwsh
        run: python scripts/release/build-info.py windows x64
      - name: Artifact inspection (Phase 26)
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/*.exe, dist/*.msi -ErrorAction SilentlyContinue | ForEach-Object FullName
          python scripts/release/inspect-artifact.py $files
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows
          path: dist/*
          if-no-files-found: error

  package-linux:
    name: Linux AppImage + DEB
    runs-on: ubuntu-latest
    needs: test
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm install
      - name: Build core runtime (sidecar)
        run: npx tsx packages/core/scripts/build-core-runtime.mts
      - name: Generate build manifest
        run: npx tsx scripts/release/gen-manifest.mts
      - name: Stage sidecar binary (host triple)
        run: |
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p apps/desktop/src-tauri/binaries
          cp dist-core/jarvis-core "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
          chmod +x "apps/desktop/src-tauri/binaries/jarvis-core-$TRIPLE"
      - name: Build AppImage + DEB
        run: npx tauri build --bundles appimage,deb
        working-directory: apps/desktop/src-tauri
      - name: Name artifacts
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then VER="${GITHUB_REF_NAME#v}"; else VER=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version"); fi
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage "dist/JARVIS_${VER}_amd64.AppImage"
          cp apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig "dist/JARVIS_${VER}_amd64.AppImage.sig"
          cp apps/desktop/src-tauri/target/release/bundle/deb/*.deb "dist/JARVIS_${VER}_amd64.deb"
          file dist/* > dist/build-filetypes.txt
      - name: Build info (manifest)
        run: python3 scripts/release/build-info.py linux amd64
      - name: Artifact inspection (Phase 26)
        run: python3 scripts/release/inspect-artifact.py dist/*.AppImage dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Draft release
    runs-on: ubuntu-latest
    needs: [package-macos, package-windows, package-linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Updater metadata (static latest.json)
        env:
          RELEASE_BASE: https://github.com/${{ github.repository }}/releases/download
        run: |
          python3 - <<'PY'
          import json, glob, os
          tag = os.environ['GITHUB_REF_NAME']
          ver = tag[1:] if tag.startswith('v') else tag
          base = os.environ['RELEASE_BASE'] + '/' + tag
          names = sorted(os.path.basename(f) for f in glob.glob('dist/*'))
          def pick(suffix, arch_hint=None):
              for n in names:
                  if n.endswith(suffix) and (arch_hint is None or arch_hint in n):
                      return n
              return None
          plats = {}
          mac = pick('.app.tar.gz')
          nsis = pick('_x64-setup.exe')
          ai = pick('_amd64.AppImage')
          if mac and os.path.exists(f'dist/{mac}.sig'):
              arch = 'aarch64' if 'arm64' in mac else 'x86_64'
              plats[f'darwin-{arch}'] = {'url': f'{base}/{mac}',
                                          'signature': open(f'dist/{mac}.sig').read().strip()}
          if nsis and os.path.exists(f'dist/{nsis}.sig'):
              plats['windows-x86_64'] = {'url': f'{base}/{nsis}',
                                          'signature': open(f'dist/{nsis}.sig').read().strip()}
          if ai and os.path.exists(f'dist/{ai}.sig'):
              plats['linux-x86_64'] = {'url': f'{base}/{ai}',
                                        'signature': open(f'dist/{ai}.sig').read().strip()}
          missing = [k for k in ('darwin-aarch64', 'windows-x86_64', 'linux-x86_64') if k not in plats]
          if missing:
              raise SystemExit(f'missing updater platform entries: {missing}')
          json.dump({'version': ver, 'notes': f'JARVIS {ver}', 'platforms': plats},
                    open('dist/latest.json', 'w'), indent=2)
          print('latest.json written:', ver, sorted(plats))
          PY
      - name: Release manifest (Phase 22)
        run: python3 scripts/release/release-manifest.py dist "$GITHUB_REF_NAME"
      - name: SHA256 checksums (verify before upload)
        run: |
          cd dist
          sha256sum $(ls | grep -v '^SHA256SUMS.txt$') > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=docs/RELEASE_NOTES.md
          if [ -f "$NOTES" ]; then
            sed "s/<version>/${GITHUB_REF_NAME}/g" "$NOTES" > /tmp/release-notes.md
            NOTES=/tmp/release-notes.md
          else
            NOTES=""
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft --title "JARVIS $GITHUB_REF_NAME" \
            ${NOTES:+--notes-file "$NOTES"} \
            ${NOTES:---generate-notes}
